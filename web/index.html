<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Publishing House Factory</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101112;color:#ededed;font:16px/1.55 system-ui}header,main,footer{max-width:1200px;margin:auto;padding:32px}header{border-bottom:1px solid #444}small,.muted{color:#aaa}h1{font-size:clamp(32px,5vw,64px);line-height:1.05;margin:18px 0}h2{font-size:24px}a{color:#eee;text-underline-offset:4px}article{border:1px solid #555;padding:24px;margin-bottom:24px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.step{border:1px solid #555;padding:8px 12px;font:12px ui-monospace}.done{background:#eee;color:#111}.links{display:flex;gap:18px;flex-wrap:wrap}.status{font:13px ui-monospace;text-transform:uppercase}pre{white-space:pre-wrap;overflow-wrap:anywhere}.label{letter-spacing:.15em}footer{border-top:1px solid #444}</style>
<header><small class="label">KUJO / PUBLISHING HOUSE FACTORY</small><h1>One brief.<br>A campaign you can inspect.</h1><p>Sources, drafts, editorial reviews and exact versions. Publication stays with you.</p></header><main id="runs"><p>Loading run evidence…</p></main><footer><small>Local evidence viewer · Refreshes every five seconds · No publication controls</small></footer>
<script>
const phases=['Commission','Evidence','Article','Assets','Review','Adapt','Package','Approval','Publish'];
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
async function refresh(){try{const response=await fetch('/api/runs');if(!response.ok)throw Error('Unable to read runs');const runs=await response.json();const root=document.getElementById('runs');root.replaceChildren();if(!runs.length){root.append(node('h2','Your first commission starts here.'),node('pre','npm run factory -- run examples/videoops-launch.json'));return;}for(const run of runs){const card=node('article');card.append(node('small',run.run),node('h2',run.title),node('div',run.item.status.replaceAll('_',' '),'status'));const steps=node('div',undefined,'steps');phases.forEach((label,i)=>steps.append(node('span',label,'step'+(i<run.item.phase_index?' done':''))));card.append(steps);if(run.item.blocker)card.append(node('pre',run.item.blocker.message));if(run.summary?.packageSha256){card.append(node('p','Model checks passed. Human editorial review is still required.','muted'),node('pre','Package SHA-256: '+run.summary.packageSha256));const links=node('div',undefined,'links');for(const [file,label] of [['article.md','Article'],['newsletter.md','Newsletter'],['social.md','Social posts'],['landing.html','Landing preview'],['package.json','Exact package'],['package-review.json','Editorial review']]){const a=node('a',label);a.href='/artifact/'+encodeURIComponent(run.run)+'/output/'+file;a.target='_blank';a.rel='noopener';links.append(a);}card.append(links);}const details=node('details');details.append(node('summary','Inspect phase receipts'));for(const receipt of run.item.receipts||[]){const p=node('p');const a=node('a',receipt.phase);a.href='/artifact/'+encodeURIComponent(run.run)+'/phases/'+receipt.phase+'.json';a.target='_blank';p.append(a,node('small',' · '+receipt.sha256.slice(0,16)));details.append(p);}card.append(details);root.append(card);}}catch(e){document.getElementById('runs').textContent='Could not load evidence. Check the local server.';}}
refresh();setInterval(refresh,5000);
</script></html>
